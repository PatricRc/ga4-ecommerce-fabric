<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Click to Checkout · GA4 Marketing Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4FA; --card:#FFFFFF; --ink:#1A1840; --sub:#5E6189; --muted:#9A9DC0; --line:#ECEDF6; --line2:#F3F4FA;
  --acc:#5B5BD6; --acc-d:#4338CA; --acc2:#8B8CF0; --acc3:#C7C8F7; --soft:#EEEFFD;
  --good:#0E9F6E; --bad:#E5484D; --warn:#F59E0B; --navy1:#1B1946; --navy2:#0F0D2E;
  --r:16px; --shadow:0 1px 2px rgba(26,24,64,.04),0 8px 24px rgba(26,24,64,.05);
  --rail:200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#DCDEF2;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#canvas{width:1280px;height:720px;background:var(--bg);position:relative;transform-origin:center center;border-radius:8px;overflow:hidden;box-shadow:0 24px 70px rgba(26,24,64,.20)}
#canvas.collapsed{--rail:68px}
/* ---------- rail ---------- */
.rail{position:absolute;left:0;top:0;bottom:0;width:var(--rail);background:linear-gradient(180deg,var(--navy1) 0%,var(--navy2) 100%);color:#fff;padding:22px 14px 16px;display:flex;flex-direction:column;transition:width .25s ease;overflow:hidden;z-index:20}
.rail::after{content:'';position:absolute;left:-60px;bottom:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(91,91,214,.35),transparent 65%);pointer-events:none}
.brand{display:flex;gap:11px;align-items:center;padding:0 4px;min-height:38px}
.logo{width:36px;height:36px;flex:none;border-radius:10px;background:linear-gradient(135deg,var(--acc),#7C7DF0);display:grid;place-items:center;font-weight:800;font-size:12.5px;box-shadow:0 6px 16px rgba(91,91,214,.4)}
.brand b{font-size:13.5px;display:block;line-height:1.2;white-space:nowrap}.brand small{font-size:10px;color:rgba(255,255,255,.55);white-space:nowrap}
.sec{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.42);margin:28px 0 10px 8px;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button,.sup button{all:unset;cursor:pointer;position:relative;display:flex;gap:12px;align-items:center;height:38px;padding:0 11px;border-radius:10px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.72);transition:background .15s,color .15s;white-space:nowrap}
.nav button svg,.sup button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover,.sup button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.nav button.on::before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--acc2)}
.sup{margin-top:auto;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.sup button.on{background:rgba(245,158,11,.18);color:#FCD34D}
.collapsed .lbl,.collapsed .brand div{display:none}
.collapsed .sec{opacity:0;pointer-events:none}
.collapsed .brand{justify-content:center;padding:0}
.collapsed .nav button,.collapsed .sup button{justify-content:center;padding:0}
.lbl{transition:opacity .15s}
#btnCol svg{transition:transform .25s}.collapsed #btnCol svg{transform:rotate(180deg)}
/* ---------- main ---------- */
.main{position:absolute;left:calc(var(--rail) + 18px);right:18px;top:16px;bottom:16px;display:flex;flex-direction:column;gap:12px;transition:left .25s ease}
.hdr{height:80px;flex:none;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 22px}
.hl{min-width:0}
.ht{display:flex;align-items:center;gap:10px}
.hn{font-size:10px;font-weight:800;color:var(--acc);background:var(--soft);border-radius:6px;padding:3px 7px;letter-spacing:.06em}
.ht h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.hs{font-size:12px;line-height:1.5;color:var(--sub);margin-top:5px;max-width:640px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.pick{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;height:36px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:600;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.pick:hover,.pick.on{border-color:var(--acc2);box-shadow:0 0 0 3px var(--soft)}
.pick svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pick .chev{stroke:var(--muted)}
.cmp{font-size:10.5px;color:var(--muted)}
.cmp b{color:var(--sub);font-weight:600}
/* ---------- kpi cards ---------- */
.kpis{height:120px;flex:none;display:flex;gap:12px}
.k{flex:1;min-width:0;background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px 16px 12px;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kh{display:flex;align-items:center;gap:9px}
.ki{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;flex:none}
.ki svg{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kl{font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kn{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:7px;line-height:1}
.kd{border-top:1px solid var(--line);margin-top:auto;padding-top:7px;display:flex;flex-direction:column;gap:3px}
.kr{display:flex;justify-content:space-between;gap:8px;font-size:10px}
.kr span{color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr b{font-weight:700;white-space:nowrap}
.k .why{position:absolute;inset:0;background:var(--ink);color:#fff;padding:14px 16px;font-size:10.5px;line-height:1.55;opacity:0;transition:opacity .2s;pointer-events:none}
.k .why b{display:block;font-size:9px;letter-spacing:.14em;color:var(--acc3);margin-bottom:5px}
.k:hover .why{opacity:1}
/* ---------- body ---------- */
#pages{flex:1;position:relative;min-height:0}
.body{position:absolute;inset:0;display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ct h3{font-size:14px;font-weight:700;letter-spacing:-.15px}
.ct p{font-size:11px;line-height:1.45;color:var(--sub);margin-top:4px}
.tog{display:flex;gap:2px;flex:none;background:var(--line2);border-radius:9px;padding:3px}
.tog button{all:unset;cursor:pointer;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:7px;color:var(--sub)}
.tog button.on{background:#fff;color:var(--acc-d);box-shadow:0 1px 3px rgba(26,24,64,.12)}
.fill{flex:1;min-height:0;position:relative;margin-top:14px}
.fill[style*="overflow"]{overflow-x:hidden!important;scrollbar-width:thin}
.foot{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.2px}
.pill.good{background:#E3F6EF;color:var(--good)}.pill.bad{background:#FDE8E8;color:var(--bad)}.pill.acc{background:var(--soft);color:var(--acc-d)}.pill.warn{background:#FEF3DD;color:#B45309}.pill.mute{background:#F1F2F8;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0;background:#fff}
th:first-child,td:first-child{text-align:left}
table[data-id="it"] td:nth-child(2),table[data-id="it"] th:nth-child(2){text-align:left}
th.sorted{color:var(--acc)}
td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
tr:hover td{background:#FAFAFE}
td .bar{display:inline-block;height:6px;border-radius:3px;background:var(--acc2);vertical-align:middle;margin-left:6px}
.trunc{max-width:230px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:10.5px;line-height:1.5;padding:9px 11px;border-radius:10px;opacity:0;transition:opacity .12s;z-index:60;max-width:260px;box-shadow:0 10px 28px rgba(26,24,64,.3)}
#tip b{color:var(--acc3)}
.insight{background:linear-gradient(150deg,var(--navy1),#2E2A7A);color:#fff;border:none}
.insight .ct p{color:#C9CAF5}
.big{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.insight .lbl2{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--acc3)}
.ovl{position:absolute;inset:0;z-index:50;display:none}
.ovl.on{display:block}
#howto{background:rgba(26,24,64,.45);backdrop-filter:blur(3px)}
#howto .panel{position:absolute;right:20px;top:20px;bottom:20px;width:370px;background:#fff;border-radius:18px;padding:26px;overflow:auto}
#howto h4{font-size:16px;margin-bottom:4px;line-height:1.35}
#howto ol{margin-top:14px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:14px}
#howto li{display:flex;gap:11px;font-size:11.5px;line-height:1.55;color:var(--sub)}
#howto li i{flex:none;width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--acc-d);font-style:normal;font-weight:800;display:grid;place-items:center;font-size:11px}
#howto li b{color:var(--ink)}
#howto .x{all:unset;cursor:pointer;position:absolute;right:16px;top:12px;font-size:22px;color:var(--sub)}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--acc)}
.build .card,.build .k{outline:2px dashed var(--warn);outline-offset:-2px}
.tag{display:none;position:absolute;right:8px;bottom:8px;z-index:30;background:#FFF7E6;color:#92400E;border:1px solid #F5C66B;font-size:9px;font-weight:700;padding:3px 6px;border-radius:6px;max-width:92%;line-height:1.35;text-align:left}
.build .tag{display:block}
.legend{display:flex;gap:14px;font-size:10.5px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{all:unset;cursor:pointer;font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--line2);color:var(--sub);text-transform:capitalize}
.chips button.on{background:var(--acc);color:#fff}
.note{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;color:#B45309;background:#FEF3DD;border-radius:6px;padding:2px 7px}
/* ---------- date picker ---------- */
#pop{position:absolute;z-index:55;display:none;background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(26,24,64,.22);width:760px;overflow:hidden}
#pop.on{display:flex}
.pp-pre{width:190px;flex:none;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:#FBFBFE}
.pp-pre small{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);padding:2px 10px 8px}
.pp-pre button{all:unset;cursor:pointer;font-size:12px;font-weight:500;color:var(--sub);padding:8px 10px;border-radius:8px}
.pp-pre button:hover{background:var(--soft);color:var(--ink)}
.pp-pre button.on{background:var(--acc);color:#fff;font-weight:700}
.pp-main{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.pp-cals{display:flex;gap:18px}
.cal{flex:1}
.cal h5{font-size:12px;font-weight:700;text-align:center;margin-bottom:8px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.cal .g span{font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:4px}
.cal .g button{all:unset;cursor:pointer;height:28px;display:grid;place-items:center;font-size:11px;color:var(--ink);border-radius:0}
.cal .g button:hover{background:var(--soft);border-radius:7px}
.cal .g button.in{background:var(--soft);color:var(--acc-d)}
.cal .g button.edge{background:var(--acc);color:#fff;font-weight:700;border-radius:7px}
.cal .g button.hol{text-decoration:underline;text-decoration-color:var(--acc2);text-underline-offset:3px}
.pp-ft{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.pp-ft p{font-size:11px;color:var(--sub);flex:1;padding-right:14px;line-height:1.45}.pp-ft p b{color:var(--ink)}
.pp-ft div{display:flex;gap:8px}
.pp-ft button{all:unset;cursor:pointer;white-space:nowrap;font-size:11.5px;font-weight:700;padding:8px 16px;border-radius:9px;background:var(--line2);color:var(--sub)}
.pp-ft button.pri{background:var(--acc);color:#fff}
.pp-ft button:disabled{opacity:.4;cursor:default}
/* ---------- rolling table ---------- */
.rt th{cursor:default;text-align:right}
.rt thead tr:first-child th{text-align:center;color:var(--acc);border-bottom:none;padding-bottom:0;letter-spacing:.14em}
.rt tbody th{position:static;text-align:left;font-size:11.5px;font-weight:600;color:var(--ink);letter-spacing:0;border-bottom:1px solid var(--line2);padding:4px 8px}
.rt td{padding:4px 10px;font-size:11.5px}
.rt thead th{padding:5px 8px}
.rt td.p{color:var(--muted)}
.rt td.sep,.rt th.sep{border-left:1px solid var(--line)}
/* cover (00 Welcome) — landing-page hero: Briarport layout + Peaches atmosphere */
.main.full .hdr,.main.full .kpis{display:none}
#cover{position:absolute;inset:0;z-index:35;display:none;overflow:hidden;background:#07061A;color:#fff}
#cover.on{display:block}
.hx-tex{position:absolute;inset:0;background:url('assets/sessions_preview.png') center/cover;opacity:.05;filter:grayscale(1);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 70%)}
.hx-glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 62%,rgba(91,91,214,.30),transparent 70%),radial-gradient(ellipse 40% 30% at 18% 90%,rgba(91,214,176,.10),transparent 70%)}
.hx-scene{position:absolute;inset:0}
.hx-dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,6,26,.55) 0%,rgba(7,6,26,.25) 45%,rgba(7,6,26,.65) 100%);opacity:0;animation:hxDim 1.6s ease 2.8s forwards}
@keyframes hxDim{to{opacity:1}}
.hx-curve{stroke-dasharray:3000;stroke-dashoffset:3000;animation:hxDraw 3.2s cubic-bezier(.65,0,.35,1) .3s forwards}
@keyframes hxDraw{to{stroke-dashoffset:0}}
.hx-bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:hxRise 1.4s cubic-bezier(.16,1,.3,1) forwards}
@keyframes hxRise{to{transform:scaleY(1)}}
.hx-wave{stroke-dasharray:14 22;animation:hxFlow 9s linear infinite}
@keyframes hxFlow{to{stroke-dashoffset:-720}}
.hx-pt{animation:hxFloat linear infinite}
@keyframes hxFloat{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-140px);opacity:0}}
.hx-pulse{transform-box:fill-box;transform-origin:center;animation:hxPulse 2.2s ease-out 3.4s infinite;opacity:0}
@keyframes hxPulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.hx-top{position:absolute;left:40px;right:40px;top:28px;display:flex;align-items:center;justify-content:space-between;z-index:5;opacity:0;animation:fadeSimple 1.2s ease 3.6s forwards}
.hx-mark{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.85)}
.hx-mark i{width:28px;height:28px;border-radius:8px;border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;letter-spacing:0}
.hx-acts{display:flex;gap:10px}
.hx-acts a,.hx-acts button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:7px;font-size:9.5px;font-weight:700;letter-spacing:.12em;color:#fff;background:rgba(91,91,214,.35);border:1px solid rgba(139,140,240,.45);transition:background .2s}
.hx-acts a:hover,.hx-acts button:hover{background:rgba(91,91,214,.6)}
.hx-acts button{background:transparent;border-color:rgba(255,255,255,.25)}
.hx-center{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:5}
.hx-eb{font-size:11px;letter-spacing:.42em;color:rgba(255,255,255,.62);font-weight:500}
.hx-title{font-size:56px;font-weight:800;letter-spacing:-.025em;margin-top:18px;line-height:1.04;text-shadow:0 10px 50px rgba(7,6,26,.8)}
.hx-sub{font-size:15.5px;font-weight:400;color:rgba(255,255,255,.80);margin-top:16px}
.hx-event{font-size:10px;letter-spacing:.3em;font-weight:700;color:rgba(255,255,255,.42);margin-top:22px}
.hx-event span{color:var(--acc3)}
.hx-band{position:absolute;left:0;right:0;bottom:0;height:132px;border-top:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(7,6,26,.55),rgba(7,6,26,.9));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;opacity:0;animation:fadeSimple 1.2s ease 4s forwards}
.hx-band small{font-size:9.5px;letter-spacing:.3em;font-weight:600;color:rgba(255,255,255,.45)}
.hx-btns{display:flex;gap:12px}
.hx-btns button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;height:38px;padding:0 18px;border-radius:7px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font-size:11.5px;font-weight:600;color:rgba(255,255,255,.88);transition:all .25s}
.hx-btns button:hover{background:rgba(91,91,214,.35);border-color:rgba(139,140,240,.6);color:#fff;transform:translateY(-2px)}
.hx-btns svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.hx-sig{position:absolute;right:42px;top:86px;text-align:right;z-index:5;opacity:0;animation:fadeSimple 1.5s ease 4.4s forwards}
.hx-sig b{display:block;font:italic 400 26px/1 'Cormorant Garamond',Georgia,serif;color:rgba(255,255,255,.75)}
.hx-sig small{font-size:8.5px;letter-spacing:.3em;color:rgba(255,255,255,.45)}
.rv{opacity:0;filter:blur(12px);transform:translateY(18px);animation:rvIn 1.6s cubic-bezier(.16,1,.3,1) forwards}
.rv-t{opacity:0;filter:blur(18px);transform:translateY(22px);animation:rvT 2.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rvIn{to{opacity:1;filter:blur(0);transform:none}}
@keyframes rvT{from{letter-spacing:.04em}to{opacity:1;filter:blur(0);transform:none;letter-spacing:-.025em}}
@keyframes fadeSimple{to{opacity:1}}
</style>
</head>
<body>
<div id="stage"><div id="canvas">
  <aside class="rail">
    <div class="brand"><div class="logo">G4</div><div><b>Merchandise Store</b><small>GA4 · Microsoft Fabric</small></div></div>
    <div class="sec">CHOOSE A PAGE</div>
    <nav class="nav" id="nav"></nav>
    <div class="sup"><div class="sec" style="margin-top:0">SUPPORT</div>
      <button id="btnHow" title="How to read"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/></svg><span class="lbl">How to read</span></button>
      <button id="btnBuild" title="Show which measure / visual each block becomes in Power BI"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span class="lbl">Build notes</span></button>

/* Pages 1-5: value row = last 7 days, change = week over week. Page 6 keeps its month-to-date and prior-period comparisons. */
function renderKpis(pg){
  const el = document.getElementById('kpis');
  const wow = pg.id !== 'time';
  el.innerHTML = pg.kpis.map(([label, m, kind, dm, dk, pm, pl, inv, ic], i) => {
    const pts = dk === 'pts', v = K(m);
    let d, pv, rowLab, chgLab, tip = '';
    if (wow){
      d = K(m + (pts ? ' L7D Δ pts' : ' L7D Δ%')); pv = K(m + ' L7D');
      rowLab = 'Last 7 days'; chgLab = 'WoW';
      tip = 'Week over week: the last 7 days of the selection against the 7 days before them.';
    } else {
      d = K(dm); pv = K(pm);
      if (nz(pv) && !nz(d) && !nz(v)) pv = pts ? v - d / 100 : v / (1 + d);
      const plab = !pl ? K('PP Label') : pl[0] === '=' ? pl.slice(1) : K(pl);
      const none = !plab || /no (earlier|prior)/.test(plab);
      rowLab = none ? 'Prior period' : plab.replace(/^vs /,'').replace(/^prior/,'Prior');
      if (none) pv = null; chgLab = 'Change';
    }
    let dt = '—', col = T('muted');
    if (!nz(d)) { const good = (d >= 0) !== !!inv; col = good ? T('good') : T('bad');
      dt = (d >= 0 ? '▲ +' : '▼ −') + (pts ? Math.abs(d).toFixed(2) + ' pts' : (Math.abs(d)*100).toFixed(1) + '%'); }
    const def = KDEF[label];
    return `<div class="k"><div class="kh"><span class="ki">${svg(ic)}</span><span class="kl">${label}</span></div>
      <div class="kn">${nz(v) ? '—' : FMT[kind](v)}</div>
      <div class="kd"><div class="kr"><span>${esc(rowLab)}</span><b style="color:${T('sub')}">${nz(pv) ? 'not in data' : FMT[kind](pv)}</b></div>
      <div class="kr" title="${esc(tip)}"><span>${chgLab}</span><b style="color:${col}">${dt}</b></div></div>
      ${def ? `<div class="why"><b>WHAT IT IS</b>${def[0]}<b>WHY IT MATTERS</b>${def[1]}</div>` : ''}
      ${i===0?`<div class="tag">HTML Content · [${pg.num} · 001 KPI Strip HTML] (one measure, all cards)</div>`:''}</div>`;
  }).join('');
}

/* ---------------- date picker ---------------- */
const HOL = {'2020-11-27':'Black Friday','2020-11-30':'Cyber Monday','2020-12-25':'Christmas','2021-01-01':'New Year'};
function openPicker(){ S.pick = {s: S.range.s, e: S.range.e}; drawPicker(); document.getElementById('pop').classList.add('on'); document.getElementById('pickBtn').classList.add('on'); }
function closePicker(){ S.pick = null; document.getElementById('pop').classList.remove('on'); const b = document.getElementById('pickBtn'); if (b) b.classList.remove('on'); }
function applyRange(s, e, key){ S.range = {s, e}; S.key = key || (D.__presetOf[s + '|' + e]) || 'custom'; closePicker(); render(); }
function drawPicker(){
  const pop = document.getElementById('pop'), pk = S.pick;
  const months = ['2020-11-01','2020-12-01','2021-01-01'];
  const cal = m => { const first = dow(m), last = +mEnd(m).slice(8,10); let cells = '';
    for (let i = 0; i < first; i++) cells += '<i></i>';
    for (let d = 1; d <= last; d++){ const ds = m.slice(0,8) + String(d).padStart(2,'0');
      const edge = ds === pk.s || ds === pk.e, inr = pk.s && pk.e && ds > pk.s && ds < pk.e;
      cells += `<button data-d="${ds}" class="${edge?'edge':inr?'in':''} ${HOL[ds]?'hol':''}" ${HOL[ds]?`title="${HOL[ds]}"`:''}>${d}</button>`; }
    return `<div class="cal"><h5>${MONL[+m.slice(5,7)-1]} ${m.slice(0,4)}</h5><div class="g">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x => `<span>${x}</span>`).join('')}${cells}</div></div>`; };
  const ok = pk.s && pk.e;
  pop.innerHTML = `<div class="pp-pre"><small>QUICK RANGES</small>${PRESETS.map(([k,t]) => `<button data-k="${k}" class="${S.key===k?'on':''}">${t}</button>`).join('')}</div>
    <div class="pp-main"><div class="pp-cals">${months.map(cal).join('')}</div>
    <div class="pp-ft"><p>${ok ? `<b>${rangeLabel(pk.s, pk.e)}</b> · ${nDays(pk.s, pk.e)} days · compared with ${ppLabel(pk.s, pk.e, ppRange(pk.s, pk.e)).replace(/^vs /,'')}` : pk.s ? `From <b>${sd(pk.s)}</b> — pick an end date` : 'Pick a start date'}</p>
    <div><button data-c>Cancel</button><button class="pri" data-a ${ok?'':'disabled'}>Apply range</button></div></div></div>`;
  pop.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const r = D[b.dataset.k].range; applyRange(r[0], r[1], b.dataset.k); });
  pop.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const d = b.dataset.d;
    if (!pk.s || pk.e) { pk.s = d; pk.e = null; } else if (d < pk.s) { pk.e = pk.s; pk.s = d; } else pk.e = d; drawPicker(); });
  pop.querySelector('[data-c]').onclick = closePicker;
  pop.querySelector('[data-a]').onclick = () => ok && applyRange(pk.s, pk.e);
}
D.__presetOf = Object.fromEntries(PRESETS.map(([k]) => [D[k].range.join('|'), k]));

/* ---------------- rolling-window table ---------------- */
function rollTable(){
  const e = S.range.e, M = [['Sessions','s','int'],['Pageviews','pv','int'],['Transactions','tx','int'],['Revenue','r','usd'],['Conversion rate','cr','pct',1],['Average order value','aov','usd2']];

  const chg = (a, b, pts) => { if (nz(a) || nz(b) || (!pts && !b)) return '<span style="color:var(--muted)">—</span>';
    const d = pts ? (a - b) * 100 : (a - b) / b, g = d >= 0;
    return `<span class="pill ${g?'good':'bad'}">${g?'▲ +':'▼ −'}${pts ? Math.abs(d).toFixed(2)+' pts' : (Math.abs(d)*100).toFixed(1)+'%'}</span>`; };
  return `<table class="rt"><thead><tr><th></th>${W.map(w => `<th colspan="3" class="sep">LAST ${w.n} DAYS</th>`).join('')}</tr>

}

/* ---------------- shared chart pieces ---------------- */
function hbars(rows, {label, value, fmt, color, max, sub, tipf, hi}){
  const mx = max ?? (Math.max(...rows.map(r => value(r) || 0)) || 1);
  return rows.map(r => {
    const v = value(r) || 0, w = Math.max(v/mx*100, .8);
    const c = typeof color === 'function' ? color(r) : (color || T('acc'));
    return `<div class="hb" data-tip="${tipf?esc(tipf(r)):''}" style="display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;padding:3px 0;${hi&&hi(r)?'font-weight:700':''}">
      <div style="font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label(r))}${sub?`<div style="font-size:9px;color:${T('muted')};font-weight:500">${sub(r)}</div>`:''}</div>
      <div style="height:12px;background:${T('soft')};border-radius:6px;overflow:hidden"><div style="height:100%;width:${w}%;background:${c};border-radius:6px;transition:width .4s"></div></div>
      <div style="font-size:10.5px;font-weight:700;text-align:right">${fmt(v)}</div></div>`;
  }).join('');
}
function sortTable(id, rows, cols, defKey){
  const st = S.sort[id] || {k: defKey, d: -1};
  const sorted = rows.slice().sort((a,b) => ((a[st.k] ?? -1e18) > (b[st.k] ?? -1e18) ? 1 : -1) * st.d);
  return `<table data-id="${id}"><thead><tr>${cols.map(c => `<th data-k="${c.k}" class="${st.k===c.k?'sorted':''}">${c.h}${st.k===c.k?(st.d<0?' ↓':' ↑'):''}</th>`).join('')}</tr></thead>
    <tbody>${sorted.map(r => `<tr ${r._tip?`data-tip="${esc(r._tip)}"`:''}>${cols.map(c => `<td>${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function bindSort(root){
  root.querySelectorAll('table[data-id] th').forEach(th => th.addEventListener('click', () => {
    const id = th.closest('table').dataset.id, k = th.dataset.k, cur = S.sort[id];

  const X = v => pl + (Math.log10(v) - xmin) / (xmax - xmin) * (W - pl - pr), Y = v => pt + (1 - v / ymax) * (H - pt - pb);

  return `<div class="body" style="grid-template-columns:1fr 1.1fr;grid-template-rows:1fr 150px">

  const minR = Math.min(...rates.slice(1)), leak = rates.indexOf(minR);
  const funnel = steps.map(([lab,s],i) => `<div data-tip="<b>${lab}</b><br>${fInt(src[s])} sessions${i?`<br>${fPct(rates[i],1)} of the previous step<br>${fInt(src[steps[i-1][1]]-src[s])} sessions lost here`:''}" style="display:grid;grid-template-columns:112px 1fr 62px 52px;gap:10px;align-items:center;flex:1">

  const lost = [['View → Cart', src.vi-src.atc],['Cart → Checkout', src.atc-src.bc],['Checkout → Payment', src.bc-src.api],['Payment → Purchase', src.api-src.ps]];
  return `<div class="body" style="grid-template-columns:1.1fr 1fr;grid-template-rows:1fr 150px">

      <div class="foot">${esc(k['Cart Window Note'] || 'All steps counted from Nov 25, when add_to_cart tracking starts in the GA4 sample.')}</div>
      ${tag('HTML Content · [04 · 002 Funnel HTML] (cart-tracked window) · device buttons = native Device slicer (tiles) · lost cards = [Lost at …] measures')}
    </div>
    <div class="card">
      <div class="ct"><div><h3>Step rates by channel</h3><p>Darker = higher pass-through · View→Buy scaled to 15%</p></div></div>

function heroScene(){
  const W = 1280, H = 720, vx = 640, hz = 500;
  const raw = D.daily.filter(d => d.date), days = raw.map((d,i) => { const w = raw.slice(Math.max(0,i-2), i+1); return {r: w.reduce((a,b) => a + (b.r||0), 0) / w.length}; }), mx = Math.max(...days.map(d => d.r || 0));
  // perspective floor
  let floor = '';
  for (let i = -14; i <= 14; i++) floor += `<line x1="${vx + i*14}" y1="${hz}" x2="${vx + i*120}" y2="${H}" />`;
  for (let k = 1; k <= 9; k++) { const t = Math.pow(k/9, 1.9), y = hz + t*(H-hz); floor += `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke-opacity="${(.15 + t*.5).toFixed(2)}"/>`; }
  // weekly sessions as a wireframe skyline on the horizon
  const wk = D.all.weekly.filter(w => w.week_start && w.days === 7), ms = Math.max(...wk.map(w => w.s));
  const bw = 46, x0 = vx - (wk.length * (bw + 10)) / 2;
  const bars = wk.map((w,i) => { const h = 22 + (w.s/ms) * 70; return `<rect class="hx-bar" x="${x0 + i*(bw+10)}" y="${hz - h}" width="${bw}" height="${h}" style="animation-delay:${.15 + i*.06}s"/>`; }).join('');
  // revenue curve as a light trail across the floor
  const X = i => 90 + i * (W - 180) / (days.length - 1), Y = v => 600 - (v / mx) * 150;
  const pts = days.map((d,i) => [X(i), Y(d.r || 0)]);
  const path = pts.map(([x,y],i) => (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1)).join('');
  const ip = days.reduce((b,d,i) => (d.r||0) > (days[b].r||0) ? i : b, 0), [px, py] = pts[ip];
  // particles rising near the peak season
  let parts = ''; const rnd = (n => () => (n = (n * 9301 + 49297) % 233280) / 233280)(7);
  for (let i = 0; i < 34; i++) { const x = 200 + rnd()*880, y = 470 + rnd()*150, r = .8 + rnd()*1.8;
    parts += `<circle class="hx-pt" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" style="animation-duration:${(5 + rnd()*7).toFixed(1)}s;animation-delay:${(rnd()*6).toFixed(1)}s"/>`; }
  return `<svg class="hx-scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
    <defs><filter id="hxg" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="hxc" x1="0" x2="1"><stop offset="0" stop-color="#8B8CF0" stop-opacity=".2"/><stop offset=".35" stop-color="#A5A6FF"/><stop offset=".62" stop-color="#C7C8F7"/><stop offset="1" stop-color="#8B8CF0" stop-opacity=".35"/></linearGradient>
      <linearGradient id="hxf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B8CF0" stop-opacity="0"/><stop offset="1" stop-color="#8B8CF0" stop-opacity=".9"/></linearGradient></defs>
    <g stroke="url(#hxf)" stroke-width="1" fill="none" opacity=".45">${floor}</g>
    <g fill="rgba(139,140,240,.04)" stroke="rgba(167,168,255,.16)" stroke-width="1">${bars}</g>
    <path d="M-40,690 C160,560 260,720 470,610 S760,520 1320,560" fill="none" stroke="#5BD6B0" stroke-opacity=".35" stroke-width="1.6" class="hx-wave"/>
    <path d="M-40,712 C180,600 300,740 520,640 S820,560 1320,600" fill="none" stroke="#8B8CF0" stroke-opacity=".35" stroke-width="1.2" class="hx-wave" style="animation-duration:13s"/>
    <path d="${path}" fill="none" stroke="#8B8CF0" stroke-width="9" stroke-opacity=".18" filter="url(#hxg)" class="hx-curve"/>
    <path d="${path}" fill="none" stroke="url(#hxc)" stroke-width="2.2" filter="url(#hxg)" class="hx-curve"/>
    <g fill="#C7C8F7">${parts}</g>
    <circle cx="${px}" cy="${py}" r="9" fill="none" stroke="#C7C8F7" stroke-width="1.5" class="hx-pulse"/>
    <circle cx="${px}" cy="${py}" r="3.5" fill="#fff" opacity="0" style="animation:fadeSimple .6s ease 3.3s forwards" filter="url(#hxg)"/>
  </svg>`;
}

  const td = D.ti_daily.filter(r => r.date).map(r => ({...r, d: r.date.slice(0,10)}));
  const fm = m === 'r' ? fUsd : fInt;
  const rollSvg = (W, H) => { const pl = 42, pr = 12, pt = 26, pb = 22;
    const vals = td.map(r => (DAYMAP[r.d] || {})[m] ?? 0), a7 = td.map(r => r[m+'7']), a28 = td.map(r => r[m+'28']);
    const mx = Math.max(...vals) * 1.06, n = td.length;
    const x = i => pl + i * (W - pl - pr) / (n - 1), y = v => pt + (1 - v / mx) * (H - pt - pb), bw = (W - pl - pr) / n * .7;
    const line = arr => arr.map((v,i) => nz(v) ? '' : `${(i && !nz(arr[i-1])) ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    let grid = ''; for (let g = 0; g <= 3; g++) { const gv = mx * g / 3; grid += `<line x1="${pl}" x2="${W-pr}" y1="${y(gv)}" y2="${y(gv)}" stroke="${T('line')}"/><text x="${pl-8}" y="${y(gv)+3}" font-size="9.5" fill="${T('muted')}" text-anchor="end">${fInt(gv)}</text>`; }
    const inSel = r => r.d >= rs && r.d <= re;
    const bars = td.map((r,i) => `<rect x="${x(i)-bw/2}" y="${y(vals[i])}" width="${bw}" height="${H-pb-y(vals[i])}" rx="1.5" fill="${T('acc3')}" fill-opacity="${inSel(r)?.8:.22}"/>`).join('');
    const last = td.map((r,i) => r.d <= re ? i : -1).filter(i => i >= 0).pop();
    const months = [['Nov',0],['Dec',30],['Jan',61]].map(([t,i]) => `<text x="${x(i)}" y="${H-5}" font-size="10" fill="${T('sub')}" font-weight="600">${t}</text>`).join('');
    const hits = td.map((r,i) => `<rect x="${x(i)-bw/2-1}" y="${pt}" width="${bw+2}" height="${H-pt-pb}" fill="transparent" data-tip="<b>${sd(r.d)}</b><br>Day ${fm(vals[i])}<br>7-day avg ${fm(a7[i])}<br>28-day avg ${fm(a28[i])}"/>`).join('');
    const e7 = a7[last], e28 = a28[last], mom = nz(e28) ? null : (e7 - e28) / e28;
    const lx = Math.max(pl + 64, Math.min(x(last), W - pr - 64));
    const callout = nz(e7) ? '' : `<g><line x1="${x(last)}" x2="${x(last)}" y1="${pt}" y2="${H-pb}" stroke="${T('ink')}" stroke-dasharray="2 3" stroke-opacity=".5"/>
      <rect x="${lx-62}" y="${pt-22}" width="124" height="18" rx="9" fill="${T('ink')}"/>
      <text x="${lx}" y="${pt-9.5}" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">${nz(mom)?'7D AVG '+fm(e7):'7D vs 28D  '+(mom>=0?'+':'−')+fPct(Math.abs(mom),0)}</text></g>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${grid}${bars}
      <path d="${line(a28)}" fill="none" stroke="${T('ink')}" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity=".7"/>
      <path d="${line(a7)}" fill="none" stroke="${T('acc')}" stroke-width="2.4"/>${months}${callout}${hits}</svg>`; };

  const months3 = [['2020-11','Nov'],['2020-12','Dec'],['2021-01','Jan']];
  const focus = re.slice(0,7), prevYm = {'2020-12':'2020-11','2021-01':'2020-12'}[focus];
  const mk = m === 'r' ? 'rmtd' : 'smtd', mname = y => months3.find(z => z[0] === y)[1];
  const paceSvg = (W, H) => { const pl = 42, pr = 36, pt = 10, pb = 22;
    const ser = months3.map(([y,t]) => [y, t, td.filter(r => r.year_month === y)]);
    const mx = Math.max(...td.map(r => r[mk] || 0)) * 1.05;
    const x = d => pl + (d - 1) / 30 * (W - pl - pr), y = v => pt + (1 - v / mx) * (H - pt - pb);
    let grid = ''; for (let g = 0; g <= 3; g++) { const gv = mx * g / 3; grid += `<line x1="${pl}" x2="${W-pr}" y1="${y(gv)}" y2="${y(gv)}" stroke="${T('line')}"/><text x="${pl-8}" y="${y(gv)+3}" font-size="9.5" fill="${T('muted')}" text-anchor="end">${fInt(gv)}</text>`; }
    const col = yy => yy === focus ? T('acc') : yy === prevYm ? T('ink') : T('acc3');
    const ends = ser.map(([yy,t,rs2]) => ({yy, t, ly: y(rs2[rs2.length-1][mk]) + 3})).sort((p,q) => p.ly - q.ly);
    ends.forEach((e2,i) => { if (i && e2.ly - ends[i-1].ly < 12) e2.ly = ends[i-1].ly + 12; });
    const lines = ser.map(([yy,t,rs2]) => { const last = rs2[rs2.length-1], ly = ends.find(e2 => e2.yy === yy).ly;
      return `<path d="${rs2.map((r,i) => (i?'L':'M') + x(r.day_of_month).toFixed(1) + ',' + y(r[mk]).toFixed(1)).join('')}" fill="none" stroke="${col(yy)}" stroke-width="${yy===focus?2.6:1.6}" ${yy===prevYm?'stroke-dasharray="5 3"':''}/>
        <text x="${x(last.day_of_month)+5}" y="${ly}" font-size="10" font-weight="800" fill="${col(yy)}">${t}</text>`; }).join('');
    const hits = Array.from({length:31}, (_,i) => i+1).map(d => { const v = ser.map(([yy,t,rs2]) => [t, (rs2.find(r => r.day_of_month === d) || {})[mk]]);
      return `<rect x="${x(d)-4}" y="${pt}" width="8" height="${H-pt-pb}" fill="transparent" data-tip="<b>Day ${d} of the month</b><br>${v.map(([t,vv]) => `${t}: ${fm(vv)}`).join('<br>')}"/>`; }).join('');
    const ticks = [1,8,15,22,29].map(d => `<text x="${x(d)}" y="${H-5}" font-size="9.5" fill="${T('sub')}" text-anchor="middle">${d}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${grid}${lines}${ticks}${hits}</svg>`; };

  const wd = P().weekday.filter(w => w.day_short);
  const mxi = Math.max(1.3, ...wd.map(w => w.ix || 0));
  const dowSvg = (W, H) => { const pl = 4, pr = 4, pt = 18, pb = 20, n = wd.length, bw = (W - pl - pr) / n;
    const y = v => pt + (1 - v / mxi) * (H - pt - pb);
    const bars = wd.map((w,i) => { const best = w.day_name === k['Best Weekday'];
      return `<g data-tip="<b>${w.day_name}</b> · ${w.days} days<br>${fUsd(w.adr)} revenue per day<br>${(w.ix||0).toFixed(2)}× a typical day · conversion ${fPct(w.cr)}">
      <rect x="${pl+i*bw+bw*.2}" y="${y(w.ix||0)}" width="${bw*.6}" height="${H-pb-y(w.ix||0)}" rx="5" fill="${w.is_weekend?T('muted'):best?T('acc'):T('acc2')}" fill-opacity="${w.is_weekend?.45:1}"/>
      <text x="${pl+i*bw+bw/2}" y="${y(w.ix||0)-5}" font-size="9.5" font-weight="800" text-anchor="middle" fill="${best?T('acc'):T('ink')}">${(w.ix||0).toFixed(2)}×</text>
      <text x="${pl+i*bw+bw/2}" y="${H-5}" font-size="10" font-weight="600" text-anchor="middle" fill="${T('sub')}">${w.day_short}</text></g>`; }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><line x1="${pl}" x2="${W-pr}" y1="${y(1)}" y2="${y(1)}" stroke="${T('ink')}" stroke-dasharray="3 3" stroke-opacity=".35"/>${bars}</svg>`; };

  const mtd = k['Revenue MTD vs PMTD %'];
  return `<div class="body" style="grid-template-columns:1.4fr 1fr .9fr;grid-template-rows:168px 1fr">
    <div class="card" style="grid-column:1;grid-row:1">
      <div class="ct"><div><h3>${m==='r'?'Revenue':'Sessions'} · 7 vs 28-day average</h3></div>
      <div style="display:flex;gap:16px;align-items:center">
      <div class="tog" data-tog="p6metric">${[['r','Revenue'],['s','Sessions']].map(([v,t]) => `<button data-v="${v}" class="${m===v?'on':''}">${t}</button>`).join('')}</div></div></div>
      <div class="fill" style="margin-top:8px">${slot('roll', rollSvg)}</div>
      ${tag('Native combo chart · Date[date] · columns [Revenue] · lines [Revenue 7D Avg], [Revenue 28D Avg] · field parameter for Revenue / Sessions')}
    </div>
    <div class="card" style="grid-column:3;grid-row:1">
      <div class="ct"><div><h3>Day-of-week pattern</h3></div></div>
      <div class="fill">${slot('dow', dowSvg)}</div>
      <div class="foot" style="margin-top:4px">Weekends: ${fPct(k['Weekend Day Share'],0)} of days, ${fPct(k['Weekend Revenue Share'],0)} of revenue.</div>
      ${tag('Native column chart · Date[day_short] × [Weekday Revenue Index] · reference line at 1.0')}
    </div>
    <div class="card" style="grid-column:1 / span 3;grid-row:2">
      <div class="ct"><div><h3>Rolling windows</h3><p>Last 7, 14 and 28 days up to ${sd(re)} vs the window just before</p></div><span class="pill acc">ENDS ${sd(re).toUpperCase()}</span></div>
      <div class="fill" style="margin-top:8px">${rollTable()}</div>
      ${tag('HTML Content · [06 · 003 Rolling Table HTML] · [<metric> L7D / P7D / L7D Δ%] … [L28D] measures in Base\\Time\\Rolling Windows')}
    </div>

      <div class="ct"><div><h3>Month-to-date pacing</h3></div></div>
