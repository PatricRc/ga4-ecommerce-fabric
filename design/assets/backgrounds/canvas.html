<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Power BI background asset source</title><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../icons/bootstrap-icons.min.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--canvas);width:1600px;height:900px;overflow:hidden;font-family:var(--font)}.surface{position:absolute;background:white;border:1px solid var(--border);border-radius:16px}.rail{position:absolute;left:0;top:0;width:88px;height:900px;background:var(--primary)}.brand{position:absolute;left:21px;top:25px;width:46px;height:46px;display:grid;place-items:center;background:white;border-radius:13px;color:var(--primary);font-size:24px}.nav{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;color:#e0dafb;font-size:9px;gap:5px;font-weight:600}.nav i{font-size:21px;line-height:1}.nav.active{background:white;color:var(--primary)}.sig{position:absolute;left:33px;bottom:25px;font-size:11px;color:white;font-weight:700}.filter{border-radius:10px}</style></head><body><div class="rail"><div class="brand"><i class="bi bi-basket2"></i></div><span class="sig">DP.</span></div><div id="surfaces"></div><script type="module">
const data=await fetch('../../specs/page-layouts.json').then(r=>r.json());const page=new URLSearchParams(location.search).get('page')||'overview';const rect=r=>`left:${r.x}px;top:${r.y}px;width:${r.width}px;height:${r.height}px`;document.querySelector('.rail').insertAdjacentHTML('beforeend',data.navigation.map(n=>`<div class="nav ${n.page===page?'active':''}" style="${rect(n.rect)}"><i class="bi bi-${n.icon}"></i><span>${n.label}</span></div>`).join(''));document.querySelector('#surfaces').innerHTML=data.pages[page].cards.map(c=>`<div class="surface" style="${rect(c.rect)}"></div>`).join('')+(page!=='welcome'?`<div class="surface filter" style="${rect(data.filters)}"></div>`:'');await document.fonts.ready;document.body.dataset.ready='true';
</script></body></html>
